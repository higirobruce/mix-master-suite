name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  MM_FUZZ_SECONDS: "3600"

jobs:
  long-fuzz:
    name: long fuzz (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.0-dev libglu1-mesa-dev mesa-common-dev xvfb
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Python dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -r tests/requirements.txt
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build render host and plugins
        run: cmake --build build -j
      - name: One hour of parameter fuzz per plugin
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a .venv/bin/python -m pytest tests/plugins/test_stability.py -q -n 4 --junitxml=build/fuzz.xml
          else
            .venv/bin/python -m pytest tests/plugins/test_stability.py -q -n 4 --junitxml=build/fuzz.xml
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-${{ matrix.os }}
          path: build/fuzz.xml
